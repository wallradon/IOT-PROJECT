<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project IOT</title>
    <link rel="icon" href="../img/logo.jpg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="img/logo.jpg" alt="Logo">
        <h1 class="head-content">ระบบจัดการข้อมูลลูกบ้าน</h1>
        <button class="logout-btn-header" id="logoutBtn">Log Out</button>
    </header>
    <main class="main-content">
        <nav>
            <ul>
                <li data-target="vehicle">VEHICLE DATA</li>
                <li id="selectUs" data-target="user">USER DATA</li>
                <li data-target="genKey">GEN KEY</li>
            </ul>
        </nav>
        <!-- VEHICLE-->
        <section class="page user-details active" id="page-vehicle">
            <div class="headUserData headVehicleData">
                <h2>ประเภท</h2>
                <h2>ทะเบียนรถ</h2>
                <h2>บ้านเลขที่</h2>
                <h2>เวลาเข้า</h2>
                <h2>เวลาออก</h2>
            </div>
            <section class="dataLoading" id="VehicleData">
                <!-- <p class="loading-text">กำลังโหลดข้อมูล...</p> -->
            </section>
        </section>

        <!-- user data -->
        <section class="page user-details" id="page-user">
            <div class="headUserData headUserListData">
                <h2>ลำดับ</h2>
                <h2>เลขที่บ้าน</h2>
                <h2>การจัดการ</h2>
            </div>
            <section class="dataLoading" id="UserData">
                <!-- <p class="loading-text">กำลังโหลดข้อมูล...</p> -->
            </section>
        </section>

        <!-- user more details -->
        <section class=" page moreUserde " id="page-userDetail">
            <section class="dataLoading"></section>
        </section>

        <!-- vehicleDetail -->
        <section class="page" id="page-vehicleDetail">
            <section class="dataLoading"></section>
        </section>

        <!-- edit user -->
        <section class="page" id="page-editUser">
            <section class="dataLoading"></section>
        </section>

        <!-- genKey -->
        <section class="page" id="page-genKey">
            <div class="headUserData center-title">
                <h2>GENERATE KEY</h2>
            </div>
            <section class="dataLoading" id="GenKeyData">
                <div class="gen-key-container">
                    <h1 id="display-gen-key" class="gen-key-display">------</h1>
                    <button id="btn-generate-key" class="submit-btn gen-key-btn">GENERATE KEY</button>
                </div>
            </section>
        </section>

        <!-- Custom Confirm Popup -->
        <div id="custom-confirm-popup" class="confirm-popup-overlay">
            <div class="confirm-popup-box">
                <h3 id="popup-title" class="popup-title">ยืนยัน</h3>
                <p id="popup-message" class="popup-message">ข้อความยืนยัน</p>
                <div class="popup-actions">
                    <button id="popup-cancel-btn" class="popup-cancel-btn">ยกเลิก</button>
                    <button id="popup-confirm-btn" class="popup-confirm-btn">ตกลง</button>
                </div>
            </div>
        </div>
        <!-- Custom Toast Notification Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Wave Loading Overlay -->
        <div id="wave-loader-overlay" class="wave-loader-overlay">
            <div class="wave-loader">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="API.js"></script>
    <script src="script.js"></script>
</body>

</html>
